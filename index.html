<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couch Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="brandName">Couch <span>Club</span></h1>
      <p>Find a movie or series on IMDb, tick it off when you've seen it, and find out who's ready to talk about it.</p>
    </div>
    <div class="me" id="me"></div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <!-- Signed out -->
  <section class="panel" id="signin" hidden>
    <div class="seg authmode" role="group" aria-label="Sign in or create an account">
      <button type="button" id="modeIn" aria-pressed="true">Sign in</button>
      <button type="button" id="modeUp" aria-pressed="false">Create account</button>
    </div>
    <p id="authHint">Welcome back. Sign in with your email and password.</p>
    <form id="pwForm" class="pwform">
      <input class="field" id="authEmail" type="email" placeholder="you@example.com" required autocomplete="email" aria-label="Email">
      <input class="field" id="authPass" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password" aria-label="Password">
      <button class="primary" id="authBtn" type="submit">Sign in</button>
    </form>
    <p id="signinMsg" hidden></p>
    <div><button type="button" class="linkbtn" id="linkInstead">Email me a sign-in link instead</button></div>
  </section>

  <!-- Signed in but not a member yet: join with the club code -->
  <section class="panel" id="notMember" hidden>
    <h2>Join the club</h2>
    <p>Enter the club code a friend gave you.</p>
    <form id="joinForm" autocomplete="off">
      <input class="field" id="joinCode" required placeholder="Club code" aria-label="Club code" autocapitalize="off" spellcheck="false">
      <button class="primary" id="joinBtn" type="submit">Join</button>
    </form>
    <p id="joinMsg" hidden></p>
    <div><button class="signout" type="button" data-signout>Sign in with another email</button></div>
  </section>

  <!-- First visit: pick a name -->
  <section class="panel" id="welcome" hidden>
    <h2>Welcome in</h2>
    <p>What should your friends call you?</p>
    <form id="welcomeForm">
      <input class="field" id="welcomeName" maxlength="30" required aria-label="Your name">
      <button class="primary" type="submit">Join the club</button>
    </form>
  </section>

  <!-- The app -->
  <div id="app" hidden>
    <form class="add" id="addForm" autocomplete="off">
      <div class="addrow">
        <div class="grow search">
          <input class="field" id="fTitle" placeholder="Search IMDb, e.g. Severance" maxlength="120" aria-label="Title" required
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="imdbList">
          <ul class="suggest" id="imdbList" role="listbox" aria-label="IMDb matches" hidden></ul>
        </div>
        <div class="seg" role="group" aria-label="Type">
          <button type="button" id="kMovie" aria-pressed="true">Movie</button>
          <button type="button" id="kSeries" aria-pressed="false">Series</button>
        </div>
        <button class="primary" id="addBtn" type="submit">Add</button>
      </div>
      <div class="picked" id="picked" hidden></div>
      <div class="more" id="moreFields" hidden>
        <input class="field" id="fYear" inputmode="numeric" placeholder="Year" maxlength="4" aria-label="Year">
        <input class="field" id="fWhere" placeholder="Where to watch (Netflix, cinema…)" maxlength="60" aria-label="Where to watch">
        <input class="field full" id="fNote" placeholder="Why should the others watch it?" maxlength="200" aria-label="Note">
      </div>
      <div class="addfoot">
        <button type="button" class="linkbtn" id="moreToggle">Add year, where to watch, note</button>
        <label class="check"><input type="checkbox" id="fSeen"> I've already seen it</label>
      </div>
    </form>
    <nav class="filters" id="filters" aria-label="Filter"></nav>
    <section class="list" id="list" aria-live="polite"></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
